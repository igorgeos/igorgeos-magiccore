name: MAGIC CORE - Testar ZIP no Godot 4.7

on:
  push:
    branches: [main, ci/magic-core-godot-tester]
    paths:
      - 'MAGIC_CORE_ATUAL.zip'
      - '.github/workflows/godot-tests.yml'
      - '.github/scripts/magic_core_ci.py'
  pull_request:
    paths:
      - 'MAGIC_CORE_ATUAL.zip'
      - '.github/workflows/godot-tests.yml'
      - '.github/scripts/magic_core_ci.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-test:
    name: Importar, executar, corrigir caminhos e retestar ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar conteúdo do repositório
        uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Testar ZIP do GitHub (com reteste)
        id: check
        shell: bash
        run: |
          python3 .github/scripts/magic_core_ci.py

      - name: Disponibilizar ZIP de saída
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-core-projeto-para-download
          path: ci-output/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Disponibilizar logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-core-resultado-testes
          path: |
            ci-output/results.json
            ci-output/summary.txt
            ci-output/logs/
          if-no-files-found: warn
          retention-days: 30
